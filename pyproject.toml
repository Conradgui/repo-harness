[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-harness"
version = "0.2.0"
description = "Local repository harness for coding agents"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0.0,<3.0; python_version < '3.11'",
  "tzdata>=2025.2,<2026",
  "rich>=13.0,<14.0",
  "prompt_toolkit>=3.0,<4.0",
]

[project.scripts]
repo-harness = "repo_harness.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.0",
  "ruff>=0.4.4",
]

# Historical brand guard: packages = ["repo_harness"]
[tool.setuptools.packages.find]
include = ["repo_harness*"]
