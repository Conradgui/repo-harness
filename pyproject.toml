[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-harness"
version = "0.1.0"
description = "Local repository harness for coding agents"
requires-python = ">=3.10"
dependencies = [
  "tzdata>=2025.2",
]

[project.scripts]
repo-harness = "repo_harness.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools]
packages = ["repo_harness"]
