version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync
      - run:
          name: Lint
          command: uv run ruff check .
      - run:
          name: Test
          command: uv run pytest -q --tb=short --cov=repo_harness --cov-report=term-missing --cov-report=html
      - store_artifacts:
          path: htmlcov
          destination: coverage-report
  test-tui:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies with TUI
          command: uv sync --extra tui
      - run:
          name: TUI Tests
          command: uv run pytest tests/test_tui.py -q --tb=short

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python-version:
                - "3.10"
                - "3.11"
                - "3.12"
                - "3.13"
      - test-tui
