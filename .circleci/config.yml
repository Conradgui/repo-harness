version: 2.1

jobs:
  test:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            python -m pip install --upgrade pip
            python -m pip install uv
      - run:
          name: Install dependencies
          command: uv sync
      - run:
          name: Lint
          command: uv run ruff check .
      - run:
          name: Test
          command: uv run pytest -q --tb=short --cov=repo_harness --cov-report=term-missing --cov-report=html
      # Coverage gate (ADR-006: numbers must be measured, not guessed).
      # First green run of this matrix produces the real per-version TOTAL from
      # the step above. Take the minimum across 3.10-3.13, then uncomment:
      #   --cov-fail-under=<min-total>
      # Do NOT hardcode a threshold before a baseline exists.
      - store_artifacts:
          path: htmlcov
          destination: coverage-report

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python-version:
                - "3.10"
                - "3.11"
                - "3.12"
                - "3.13"
